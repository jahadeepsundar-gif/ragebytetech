<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#070709">
  <title>Kaatchi Productions Character Filmstrip</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: "RageByte Display", "Arial Narrow", "Helvetica Neue", Arial, sans-serif;
      background: #070709;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #070709;
    }

    body {
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    button {
      font: inherit;
    }

    .stage {
      --pointer-x: 50%;
      position: relative;
      width: 100%;
      height: 100%;
      min-height: 440px;
      overflow: hidden;
      isolation: isolate;
      perspective: 1450px;
      cursor: ew-resize;
      touch-action: none;
      background:
        linear-gradient(90deg, rgba(232, 230, 225, 0.04) 1px, transparent 1px) 50% 0 / 25% 100%,
        repeating-linear-gradient(
          0deg,
          transparent 0,
          transparent 109px,
          rgba(130, 67, 52, 0.08) 110px,
          transparent 111px
        ),
        radial-gradient(circle at var(--pointer-x) 48%, rgba(232, 230, 225, 0.12), transparent 38%),
        #070709;
    }

    .stage::before {
      content: "";
      position: absolute;
      inset: 0;
      z-index: 5;
      pointer-events: none;
      opacity: 0.22;
      background:
        repeating-radial-gradient(circle at 12% 18%, rgba(130, 67, 52, 0.18) 0 0.5px, transparent 0.7px 4px),
        repeating-radial-gradient(circle at 78% 71%, rgba(232, 230, 225, 0.15) 0 0.5px, transparent 0.8px 5px);
      mix-blend-mode: screen;
    }

    .stage::after {
      content: "";
      position: absolute;
      inset: 0;
      z-index: 4;
      pointer-events: none;
      background: linear-gradient(
        90deg,
        rgba(7, 7, 9, 0.85),
        transparent 14%,
        transparent 86%,
        rgba(7, 7, 9, 0.85)
      );
    }

    .deck {
      position: absolute;
      inset: 0;
      z-index: 2;
      transform-style: preserve-3d;
    }

    .card {
      --focus: 0;
      position: absolute;
      top: 50%;
      left: 50%;
      width: clamp(158px, 17.2vw, 244px);
      aspect-ratio: 0.72;
      padding: 7px;
      overflow: hidden;
      border: 1px solid rgba(130, 67, 52, 0.4);
      border-radius: 6px;
      color: #f4eee6;
      background: #111116;
      box-shadow:
        0 calc(10px + var(--focus) * 26px) calc(18px + var(--focus) * 38px)
          rgba(0, 0, 0, calc(0.45 + var(--focus) * 0.35)),
        inset 0 0 0 1px rgba(255, 255, 255, 0.08);
      appearance: none;
      outline: none;
      transform-style: preserve-3d;
      will-change: transform, opacity, filter;
      cursor: pointer;
      transition: border-color 0.25s ease, box-shadow 0.25s ease;
    }

    .card * {
      pointer-events: none;
      -webkit-user-drag: none;
      user-select: none;
    }

    .card::before {
      content: "";
      position: absolute;
      inset: 5px;
      z-index: 3;
      border: 1px solid rgba(232, 230, 225, calc(0.08 + var(--focus) * 0.25));
      border-radius: 3px;
      pointer-events: none;
    }

    .card[aria-current="true"] {
      border-color: rgba(232, 230, 225, 0.85);
      box-shadow:
        0 calc(14px + var(--focus) * 28px) calc(24px + var(--focus) * 44px)
          rgba(232, 230, 225, 0.25),
        inset 0 0 0 1px rgba(232, 230, 225, 0.6);
    }

    .card:focus-visible {
      box-shadow:
        0 26px 50px rgba(0, 0, 0, 0.65),
        0 0 0 4px rgba(232, 230, 225, 0.5);
    }

    .portrait {
      position: absolute;
      inset: 7px 7px 26%;
      overflow: hidden;
      border-radius: 4px;
      background: #18151a;
    }

    .portrait img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
      transform: scale(calc(1.04 + (1 - var(--focus)) * 0.06));
      /* monochrome site theme: black-and-white portraits */
      filter:
        grayscale(1)
        contrast(calc(1.02 + var(--focus) * 0.08));
      transition: filter 0.3s ease;
    }

    .footer {
      position: absolute;
      right: 7px;
      bottom: 7px;
      left: 7px;
      height: calc(26% - 7px);
      display: grid;
      grid-template-columns: clamp(26px, 3.2vw, 40px) 1fr;
      align-items: center;
      gap: clamp(6px, 0.7vw, 11px);
      padding: clamp(7px, 0.8vw, 12px);
      color: #f4eee6;
      background: #09090d;
      border-radius: 0 0 4px 4px;
      border-top: 1px solid rgba(255, 255, 255, 0.06);
      text-align: left;
    }

    .index {
      display: grid;
      width: clamp(23px, 2.7vw, 36px);
      aspect-ratio: 1;
      place-items: center;
      border: 1px solid rgba(232, 230, 225, 0.5);
      border-radius: 50%;
      color: #e8e6e1;
      font: 600 clamp(7px, 0.68vw, 11px)/1 "RageByte Mono", ui-monospace, "SFMono-Regular", monospace;
    }

    .meta {
      min-width: 0;
    }

    .name,
    .role {
      display: block;
      overflow: hidden;
      text-overflow: ellipsis;
      text-transform: uppercase;
      white-space: nowrap;
    }

    .name {
      color: #f4eee6;
      font-size: clamp(8px, 0.86vw, 13px);
      font-weight: 800;
      letter-spacing: 0.06em;
      line-height: 1.1;
    }

    .role {
      margin-top: clamp(2px, 0.3vw, 4px);
      color: #e8e6e1;
      font-family: "RageByte Mono", ui-monospace, monospace;
      font-size: clamp(6px, 0.52vw, 8.5px);
      font-weight: 700;
      letter-spacing: 0.12em;
      line-height: 1;
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    @media (max-width: 650px) {
      .stage {
        min-height: 520px;
        cursor: ns-resize;
        background:
          linear-gradient(90deg, rgba(232, 230, 225, 0.04) 1px, transparent 1px) 50% 0 / 50% 100%,
          repeating-linear-gradient(
            0deg,
            transparent 0,
            transparent 87px,
            rgba(130, 67, 52, 0.08) 88px,
            transparent 89px
          ),
          radial-gradient(circle at 50% 50%, rgba(232, 230, 225, 0.12), transparent 35%),
          #070709;
      }

      .card {
        width: clamp(148px, 48vw, 186px);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .card {
        will-change: auto;
      }
    }
  </style>
</head>
<body>
  <main class="stage" id="stage" aria-label="Interactive Kaatchi Productions team member filmstrip">
    <h1 class="sr-only">Kaatchi Productions Team Filmstrip</h1>
    <p class="sr-only">Move, scroll, or use the arrow keys to browse the team members.</p>
    <div class="deck" id="deck" data-testid="filmstrip"></div>
  </main>

  <script>
    (() => {
      // 8 Kaatchi Productions Team Members
      const defaultTeam = [
        { id: "team-01", name: "Jahadeep Sundar", role: "Systems Architecture", image: "/images/team/team-01.webp" },
        { id: "team-02", name: "Arjun Mehta", role: "Web Performance & Motion", image: "/images/team/team-02.webp" },
        { id: "team-03", name: "Kavita Rao", role: "Design Systems & UX", image: "/images/team/team-03.webp" },
        { id: "team-04", name: "Rohan Varma", role: "APIs & Data Pipelines", image: "/images/team/team-04.webp" },
        { id: "team-05", name: "Ananya Sen", role: "Storefronts & Checkout", image: "/images/team/team-05.webp" },
        { id: "team-06", name: "Devendra Patel", role: "Infrastructure & SRE", image: "/images/team/team-06.webp" },
        { id: "team-07", name: "Pooja Nair", role: "Three.js & WebGL Visuals", image: "/images/team/team-07.webp" },
        { id: "team-08", name: "Siddharth Roy", role: "Automated Testing & Speed", image: "/images/team/team-08.webp" }
      ];

      const profiles = (window.__TEAM_MEMBERS && window.__TEAM_MEMBERS.length) ? window.__TEAM_MEMBERS : defaultTeam;

      const stage = document.querySelector("#stage");
      const deck = document.querySelector("#deck");
      const cards = profiles.map((profile, index) => {
        const card = document.createElement("button");
        card.className = "card";
        card.type = "button";
        card.dataset.index = String(index);
        card.setAttribute("aria-label", `Focus ${profile.name}, ${profile.role || profile.designation}`);
        card.innerHTML = `
          <span class="portrait">
            <img src="${profile.image || profile.portrait}" alt="Portrait of ${profile.name}">
          </span>
          <span class="footer">
            <span class="index">${String(index + 1).padStart(2, "0")}</span>
            <span class="meta">
              <span class="name">${profile.name}</span>
              <span class="role">${profile.role || profile.shortRole || profile.designation}</span>
            </span>
          </span>`;
        deck.append(card);
        return card;
      });

      const count = cards.length;
      const reducedMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;
      const state = {
        phase: 0,
        target: 0,
        base: 0,
        pointerX: 0,
        pointerY: 0,
        active: false,
        lastInput: performance.now(),
        lastNotified: -1,
        selected: -1
      };

      function notifyActive(index) {
        if (state.lastNotified !== index) {
          state.lastNotified = index;
          const profile = profiles[index];
          const memberId = profile && profile.id ? profile.id : `team-0${index + 1}`;
          try {
            window.parent?.postMessage({
              type: "character-filmstrip-active",
              id: memberId,
              index: index
            }, "*");
          } catch (e) {}
        }
      }

      let lastSelectedTime = 0;
      let lastSelectedIndex = -1;

      function selectMember(index) {
        if (index < 0 || index >= count) return;
        const now = performance.now();
        if (index === lastSelectedIndex && now - lastSelectedTime < 250) return;
        lastSelectedTime = now;
        lastSelectedIndex = index;
        state.selected = index;
        moveTo(index);
        const profile = profiles[index];
        const memberId = profile && profile.id ? profile.id : `team-0${index + 1}`;
        try {
          window.parent?.postMessage({
            type: "character-filmstrip-click",
            id: memberId,
            index: index
          }, "*");
        } catch (e) {}
      }

      function wrappedDelta(index, phase) {
        let delta = index - phase;
        while (delta > count / 2) delta -= count;
        while (delta < -count / 2) delta += count;
        return delta;
      }

      function nearestIndex() {
        return (Math.round(state.phase) % count + count) % count;
      }

      function moveTo(index) {
        const current = nearestIndex();
        let delta = index - current;
        if (delta > count / 2) delta -= count;
        if (delta < -count / 2) delta += count;
        state.base = Math.round(state.base) + delta;
        state.target = state.base;
        state.active = false;
        state.lastInput = performance.now();
        notifyActive(index);
      }

      // Drag vs Click state tracking
      const drag = {
        isDown: false,
        pointerId: null,
        startX: 0,
        startY: 0,
        startBase: 0,
        lastX: 0,
        lastY: 0,
        velocity: 0,
        lastMoveTime: 0,
        isDragGesture: false,
        targetCardIndex: -1,
      };

      cards.forEach((card, index) => {
        card.addEventListener("click", (e) => {
          if (drag.isDragGesture) return;
          selectMember(index);
        });
        card.addEventListener("focus", () => moveTo(index));
      });

      // Listen for command from parent window to move to a specific card
      window.addEventListener("message", (event) => {
        if (!event.data) return;
        if (event.data.type === "character-filmstrip-move-to" && typeof event.data.index === "number") {
          state.selected = event.data.index;
          moveTo(event.data.index);
        } else if (event.data.type === "character-filmstrip-deselect") {
          state.selected = -1;
        }
      });

      stage.addEventListener("pointerdown", (event) => {
        if (event.button !== 0 && event.pointerType === "mouse") return;
        drag.isDown = true;
        drag.pointerId = event.pointerId;
        drag.startX = event.clientX;
        drag.startY = event.clientY;
        drag.lastX = event.clientX;
        drag.lastY = event.clientY;
        drag.startBase = state.base;
        drag.velocity = 0;
        drag.lastMoveTime = performance.now();
        drag.isDragGesture = false;

        const cardElem = event.target.closest(".card");
        drag.targetCardIndex = cardElem && cardElem.dataset.index !== undefined ? Number(cardElem.dataset.index) : -1;

        try {
          stage.setPointerCapture(event.pointerId);
        } catch (e) {}

        state.active = true;
        state.lastInput = performance.now();
      });

      stage.addEventListener("pointermove", (event) => {
        const rect = stage.getBoundingClientRect();
        const nx = Math.max(-1, Math.min(1, ((event.clientX - rect.left) / rect.width - 0.5) * 2));
        const ny = Math.max(-1, Math.min(1, ((event.clientY - rect.top) / rect.height - 0.5) * 2));
        state.pointerX = nx;
        state.pointerY = ny;
        stage.style.setProperty("--pointer-x", `${(nx + 1) * 50}%`);

        if (drag.isDown && event.pointerId === drag.pointerId) {
          const dx = event.clientX - drag.startX;
          const dy = event.clientY - drag.startY;
          const dist = Math.hypot(dx, dy);

          if (!drag.isDragGesture && dist > 6) {
            drag.isDragGesture = true;
            state.selected = -1;
          }

          if (drag.isDragGesture) {
            const now = performance.now();
            const dt = Math.max(1, now - drag.lastMoveTime);
            const moveDelta = innerWidth < 650 ? (event.clientY - drag.lastY) : -(event.clientX - drag.lastX);
            drag.velocity = moveDelta / dt;
            drag.lastX = event.clientX;
            drag.lastY = event.clientY;
            drag.lastMoveTime = now;

            const dragSensitivity = innerWidth < 650 ? dy / 150 : -dx / 150;
            state.base = drag.startBase + dragSensitivity;
            state.target = state.base;
            state.lastInput = now;
          }
        } else if (!drag.isDown) {
          state.active = true;
          state.target = state.base + (innerWidth < 650 ? ny * 1.8 : nx * 2.4);
          state.lastInput = performance.now();
        }
      });

      const handlePointerEnd = (event) => {
        if (!drag.isDown || (event.pointerId !== undefined && event.pointerId !== drag.pointerId)) return;

        try {
          if (drag.pointerId !== null) stage.releasePointerCapture(drag.pointerId);
        } catch (e) {}

        const wasDragging = drag.isDragGesture;
        const targetIndex = drag.targetCardIndex;

        drag.isDown = false;
        drag.pointerId = null;
        drag.isDragGesture = false;
        drag.targetCardIndex = -1;
        state.active = false;
        state.lastInput = performance.now();

        if (wasDragging) {
          let momentum = drag.velocity * 35;
          momentum = Math.max(-2, Math.min(2, momentum));
          state.base += momentum;
          state.target = Math.round(state.base);
          state.base = state.target;
        } else if (targetIndex >= 0) {
          selectMember(targetIndex);
        }
      };

      stage.addEventListener("pointerup", handlePointerEnd);
      stage.addEventListener("pointercancel", handlePointerEnd);

      stage.addEventListener("pointerleave", () => {
        if (!drag.isDown) {
          state.active = false;
          state.pointerX = 0;
          state.pointerY = 0;
          state.target = state.base;
          stage.style.setProperty("--pointer-x", "50%");
        }
      });

      stage.addEventListener("wheel", (event) => {
        event.preventDefault();
        const direction = Math.sign(Math.abs(event.deltaY) > Math.abs(event.deltaX) ? event.deltaY : event.deltaX);
        if (!direction) return;
        state.selected = -1;
        state.base += direction;
        state.target = state.base;
        state.active = false;
        state.lastInput = performance.now();
      }, { passive: false });

      addEventListener("keydown", (event) => {
        const forward = event.key === "ArrowRight" || event.key === "ArrowDown";
        const backward = event.key === "ArrowLeft" || event.key === "ArrowUp";
        if (!forward && !backward) return;
        event.preventDefault();
        state.selected = -1;
        state.base += forward ? 1 : -1;
        state.target = state.base;
        state.active = false;
        state.lastInput = performance.now();
      });

      const resizeObserver = new ResizeObserver((entries) => {
        for (const entry of entries) {
          state.width = entry.contentRect.width;
          state.height = entry.contentRect.height;
        }
      });
      resizeObserver.observe(stage);

      let previousTime = performance.now();

      function render(time) {
        const deltaTime = Math.min(32, time - previousTime);
        previousTime = time;
        const ease = reducedMotion ? 1 : 1 - Math.pow(0.001, deltaTime / 1000);

        if (!state.active && state.selected === -1 && time - state.lastInput > 4200) {
          const idle = time - state.lastInput - 4200;
          state.target = state.base + Math.sin(idle * 0.00035) * 2.2;
        }

        state.phase += (state.target - state.phase) * ease;
        const width = state.width || innerWidth;
        const height = state.height || innerHeight;
        const compact = width < 650;
        const activeIndex = nearestIndex();
        const horizontalSpacing = Math.min(176, Math.max(120, width * 0.124));
        const verticalSpacing = Math.min(128, Math.max(90, height * 0.116));

        cards.forEach((card, index) => {
          const delta = wrappedDelta(index, state.phase);
          const distance = Math.abs(delta);
          const focus = Math.exp(-distance * distance * 1.28);
          const side = Math.max(0, 1 - distance / 5);
          const direction = Math.sign(delta);
          const x = compact
            ? delta * 24 + Math.sin(delta * 0.9) * 25
            : delta * horizontalSpacing;
          const y = compact
            ? delta * verticalSpacing
            : distance * 8 + state.pointerY * focus * 10;
          const z = focus * 145 - distance * 148;
          const scale = 0.54 + side * 0.15 + focus * 0.54;
          const rotateX = compact ? delta * 2.1 : -state.pointerY * focus * 3.5;
          const rotateY = compact
            ? -delta * 5
            : -direction * (distance > 0.2 ? 14 + Math.min(distance, 3) * 5 : 0) + state.pointerX * focus * 8;
          const rotateZ = compact ? delta * -1.4 : delta * 0.7;

          card.style.setProperty("--focus", focus.toFixed(4));
          card.style.zIndex = String(Math.round(1000 - distance * 100));
          card.style.opacity = String(Math.max(0.13, side * 0.76 + focus * 0.24));
          card.style.filter = `blur(${Math.max(0, distance - 1.5) * 0.38}px)`;
          card.style.transform = [
            "translate(-50%, -50%)",
            `translate3d(${x.toFixed(2)}px, ${y.toFixed(2)}px, ${z.toFixed(2)}px)`,
            `rotateX(${rotateX.toFixed(2)}deg)`,
            `rotateY(${rotateY.toFixed(2)}deg)`,
            `rotateZ(${rotateZ.toFixed(2)}deg)`,
            `scale(${scale.toFixed(4)})`
          ].join(" ");
          card.setAttribute("aria-current", index === activeIndex ? "true" : "false");
        });

        // Notify parent of active index change during smooth drag/scroll
        if (!state.active) {
          notifyActive(activeIndex);
        }

        requestAnimationFrame(render);
      }

      requestAnimationFrame(render);
    })();
  </script>
</body>
</html>
